# KTP Tier 1 — Build-time smoke for KTPGrenades
#
# This repo ships TWO plugins from one source tree:
#   - KTPGrenadeLoadout (per-class grenade slot configuration)
#   - KTPGrenadeDamage  (grenade damage reduction, e.g. anti-frag stacking)
#
# Matrix runs both in parallel — each calls the reusable smoke workflow
# independently with its own assertion. fail-fast: false ensures one
# plugin's red doesn't cancel the other's run.
#
# Implementation in KTPInfrastructure/.github/workflows/smoke-callable.yml.

name: Tier 1 Smoke

on:
  # No `paths-ignore` filter -- the job below is a REQUIRED status check.
  # A path-filtered workflow never fires on a docs-only PR, so the check
  # never reports and the PR cannot be merged without an --admin override.
  # Cost of firing on every PR is one smoke run; cost of the filter is a
  # branch nobody can merge.
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - source: KTPGrenadeLoadout.sma
            artifact: KTPGrenadeLoadout.amxx
            name: KTPGrenadeLoadout
          - source: KTPGrenadeDamage.sma
            artifact: KTPGrenadeDamage.amxx
            name: KTPGrenadeDamage
    uses: afraznein/KTPInfrastructure/.github/workflows/smoke-callable.yml@main
    with:
      under_test_label: KTPGrenades / ${{ matrix.plugin.name }}
      under_test_kind: amx_plugin
      amxx_source: ${{ matrix.plugin.source }}
      artifact_container_path: /opt/hlds/dod/addons/ktpamx/plugins/${{ matrix.plugin.artifact }}
      assert_plugin: ${{ matrix.plugin.name }}
    secrets:
      ktp_checkout_token: ${{ secrets.KTP_CHECKOUT_TOKEN }}
