# KTP Tier 1 — config-parse tests (per-plugin)
#
# Validates the schema of `data/grenade_loadout.ini`. Catches typos in
# section names (the plugin ignores sections and matches class names
# globally — allies/axis/british is a readability convention this test
# enforces), out-of-range counts, and duplicate keys (which configparser
# silently last-wins on).

name: config tests

on:
  # No `paths-ignore` filter -- the job below is a REQUIRED status check.
  # A path-filtered workflow never fires on a docs-only PR, so the check
  # never reports and the PR cannot be merged without an --admin override.
  # This suite is sub-second, so firing on every PR costs nothing; the
  # filter costs a branch nobody can merge.
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Run config-parse tests
        run: pytest tests/config_parse/ -v
